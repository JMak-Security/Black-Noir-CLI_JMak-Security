[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blacknoir"
version = "1.0.0"
description = "Deep-search OSINT agent that resolves identities instead of dumping links: clusters namesakes into scored candidates, asks when ambiguous, and never identifies people from faces."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "JMak-Security" }]
keywords = [
    "osint", "reconnaissance", "investigation", "cli", "ai-agent",
    "identity-resolution", "threat-intelligence",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

# Core: enough to run live collection and write reports. Everything that only
# some users need is an extra, so `pip install blacknoir` stays small.
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
# LLM providers. `openai` also backs the Google, NVIDIA and Ollama providers,
# which all speak the OpenAI wire format — without it the tool silently falls
# back to heuristic mode, so most people want this one.
ai = ["openai>=1.30", "anthropic>=0.40"]
# Presents a real browser's TLS fingerprint instead of Python's. Off unless
# BLACKNOIR_IMPERSONATE is set; see the note atop blacknoir/http.py.
impersonate = ["curl_cffi>=0.7"]
# Local EXIF/GPS extraction from input images.
images = ["Pillow>=10.0"]
all = [
    "openai>=1.30",
    "anthropic>=0.40",
    "curl_cffi>=0.7",
    "Pillow>=10.0",
]
dev = ["pyinstaller>=6.0", "build>=1.0", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/JMak-Security/Black-Noir-CLI_JMak-Security"
Repository = "https://github.com/JMak-Security/Black-Noir-CLI_JMak-Security"
Issues = "https://github.com/JMak-Security/Black-Noir-CLI_JMak-Security/issues"
Changelog = "https://github.com/JMak-Security/Black-Noir-CLI_JMak-Security/releases"

[project.scripts]
blacknoir = "blacknoir._entry:main"

[tool.setuptools]
# Explicit, so a stray top-level directory can never be packaged by accident.
packages = ["blacknoir", "blacknoir.connectors"]

[tool.setuptools.package-data]
blacknoir = []
